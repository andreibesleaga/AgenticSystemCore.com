# The issue chooser: a blank issue stays possible; a security problem goes to
# private vulnerability reporting, never to a public issue (SECURITY.md).
blank_issues_enabled: true
contact_links:
  - name: Report a security problem privately
    url: https://github.com/andreibesleaga/AgenticSystemCore.com/security/advisories/new
    about: Private vulnerability reporting. Please do not open a public issue for a security problem.
  - name: Propose a change to the specification or the engine's guides
    url: https://github.com/andreibesleaga/agentic-system-core/issues/new/choose
    about: The specification, the guides under /docs/ that come from the engine, and the vocabulary live in the engine repository.
