# The gate of this site, on every push and every pull request.
#
#   What runs  the engine repository is checked out beside this one and installed;
#              the tests of the gate's own helpers (`scripts/*.test.*`, no network);
#              on a pull request that changes `www/`, `node scripts/check.js` alone,
#              so the committed output is compared with a fresh build of the commit
#              it names (its content version, AGSC-04-25), which is how a release
#              pull request that commits `www/` on its own is proved; then
#              `node scripts/build.js && node scripts/check.js` (two identical
#              builds compared with each other; `build.js` overwrites `www/` in the
#              runner first, so this step proves the sources, not the committed
#              output: rebuild and commit after every engine change; the discovery document at
#              Levels 0 and 2; links, headers, contrast, the page tools, public
#              hygiene), `node scripts/page-tools-check.js` (the seven page tools
#              proved against the built site, no browser) and the engine's hygiene
#              sweep over this repository.
#   Engine     `andreibesleaga/agentic-system-core` at ENGINE_REF (below):
#              `main` by default, the state the committed output was built from.
#              The build instant is the engine's last commit (or the release tag's),
#              so the site is rebuilt and committed whenever the engine changes what
#              it emits; a red run after an engine change means exactly that. Set the
#              variable to a tag or a commit to pin. A manual run can name another ref,
#              and another specification tag (`spec_tag`, read by the scripts as
#              SITE_SPEC_TAG), for a run whose default tag does not exist yet.
#   History    both checkouts take the full history: the release tag must be visible
#              to the generator, and the content version derives from this
#              repository's git log. A pull request builds its head commit, not the
#              merge commit GitHub synthesises, for the same reason.
#   Browser    the accessibility lane (`scripts/a11y.js`: axe-core over every page in
#              both colour schemes at a desktop and a phone width, each file with the
#              content type `_headers` gives it, CSP, third-party requests, keyboard
#              checks) needs
#              a browser and two packages installed outside the repository, so it
#              runs only on request: a manual run with `a11y` ticked, or the
#              repository variable AGSC_A11Y set to `true`.
#   Secrets    none. The engine repository is public, so the default token reads it.
#              Permissions: read the repositories, nothing else.
#
# Every action is pinned to a commit SHA with the version beside it — the SHAs the
# engine's own workflows pin — so that a moved tag cannot change what runs.

name: test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: 'engine ref to check out beside the site (empty = ENGINE_REF)'
        required: false
        default: ''
        type: string
      spec_tag:
        description: 'specification tag the site is built from (empty = the default in scripts/build.js)'
        required: false
        default: ''
        type: string
      a11y:
        description: 'also run the browser lane (scripts/a11y.js)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  ENGINE_REF: main

jobs:
  site:
    name: site (build, gate, page tools, hygiene)
    runs-on: ubuntu-latest
    env:
      SITE_SPEC_TAG: ${{ inputs.spec_tag }}
    steps:
      - name: this repository, with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: AgenticSystemCore.com
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: the engine, beside it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andreibesleaga/agentic-system-core
          ref: ${{ inputs.engine_ref || env.ENGINE_REF }}
          path: agentic-system-core
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: install the engine
        working-directory: agentic-system-core
        run: npm ci
      - name: the tests of the gate's own helpers (no network)
        working-directory: AgenticSystemCore.com
        run: node --test scripts/built-commit.test.js scripts/live-check.test.mjs
      - name: the committed output, on a pull request that changes it
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: AgenticSystemCore.com
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...HEAD" -- www; then
            echo "this pull request does not change www/: the committed output is not checked here"
          else
            node scripts/check.js
          fi
      - name: build twice and run the gate
        working-directory: AgenticSystemCore.com
        run: node scripts/build.js && node scripts/check.js
      - name: the seven page tools, proved against the built site
        working-directory: AgenticSystemCore.com
        run: node scripts/page-tools-check.js
      - name: public means clean
        working-directory: AgenticSystemCore.com
        run: node ../agentic-system-core/tools/public-hygiene .

  a11y:
    name: browser lane (on request)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.a11y) || vars.AGSC_A11Y == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: AgenticSystemCore.com
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: the two browser packages, outside the repository
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cd "$RUNNER_TEMP/a11y"
          npm i --no-save --no-audit --no-fund playwright-core@1.62.1 axe-core@4.13.0
      - name: axe-core over every page of the committed output, both colour schemes, desktop and phone width
        working-directory: AgenticSystemCore.com
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/a11y/node_modules
        run: |
          # The runner image ships Google Chrome; the lane takes any Chromium binary.
          CHROME_EXE="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          export CHROME_EXE
          node scripts/a11y.js
